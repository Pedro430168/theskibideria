<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendente Virtual - Hamburgueria</title>

    <style>
        /* ===== TEMA (edite as cores aqui) ===== */
        :root {
            --primary: #d84315;
            --primary-dark: #a82f0c;
            --secondary: #ffb300;
            --accent: #d84315;
            --bg-chat: #fbf6f1;
            --text: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--secondary), #ffd980);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 430px;
            height: 700px;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        /* CABEÇALHO */

        .chat-header {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .school-icon {
            width: 48px;
            height: 48px;
            background: white;
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-info h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .status {
            font-size: 13px;
            opacity: 0.9;
        }

        .online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 5px;
        }

        /* ÁREA DO CHAT */

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: var(--bg-chat);
        }

        .message {
            display: flex;
            margin-bottom: 15px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 78%;
            padding: 12px 15px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .bot .message-content {
            background: white;
            color: var(--text);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .user .message-content {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
            word-break: break-word;
        }

        .time {
            display: block;
            font-size: 10px;
            margin-top: 5px;
            opacity: 0.6;
        }

        /* BOTÕES DE AÇÃO DENTRO DA RESPOSTA */

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .action {
            display: inline-block;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 16px;
            font-size: 12px;
            border: none;
            cursor: pointer;
        }

        .action:hover {
            background: var(--primary-dark);
        }

        /* OPÇÕES */

        .quick-options {
            padding: 10px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        .quick-options p {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }

        .options {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .option {
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            padding: 8px 11px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.2s;
        }

        .option:hover {
            background: var(--primary);
            color: white;
        }

        /* CAMPO DE DIGITAÇÃO */

        .chat-input {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
        }

        .chat-input input {
            flex: 1;
            border: none;
            outline: none;
            background: #f4f1ee;
            border-radius: 25px;
            padding: 13px 17px;
            font-size: 14px;
        }

        .chat-input input:focus-visible,
        .option:focus-visible,
        .action:focus-visible,
        .send-button:focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 2px;
        }

        .send-button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .send-button:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        /* DIGITANDO */

        .typing {
            display: none;
            font-size: 12px;
            color: #777;
            padding: 0 20px 8px;
            background: var(--bg-chat);
        }

        /* RESPONSIVO */

        @media (max-width: 500px) {

            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- CABEÇALHO -->
    <div class="chat-header">

        <div class="school-icon" id="headerIcon">🍔</div>

        <div class="header-info">
            <h2 id="botName">Atendente Virtual</h2>

            <div class="status">
                <span class="online"></span>
                <span id="statusText">Online</span>
            </div>
        </div>

    </div>


    <!-- MENSAGENS -->
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>


    <!-- INDICADOR -->
    <div class="typing" id="typing">
        🤖 Atendente está digitando...
    </div>


    <!-- OPÇÕES -->
    <div class="quick-options">

        <p>Escolha uma opção:</p>

        <div class="options" id="quickOptions"></div>

    </div>


    <!-- INPUT -->
    <div class="chat-input">

        <input
            type="text"
            id="messageInput"
            placeholder="Digite sua mensagem..."
            aria-label="Digite sua mensagem"
            autocomplete="off"
        >

        <button class="send-button" id="sendButton" aria-label="Enviar mensagem">
            ➤
        </button>

    </div>

</div>


<script>

    /* =====================================================
       CONFIGURAÇÃO DO NEGÓCIO
       Edite apenas este objeto para atualizar dados,
       cardápio e textos. A lógica fica mais abaixo.
       ===================================================== */

    const CONFIG = {
        nome: "The Skibideria",
        atendente: "Skibid Bot",
        icone: "🍔",
        endereco: "ENDEREÇO COMPLETO",
        telefone: "(00) 00000-0000",
        whatsapp: "5500000000000",          // somente números, com DDI e DDD
        instagram: "",                      // opcional, ex.: "https://instagram.com/seuperfil"
        horario: "Ter a Dom, 18h às 23h30 • Segunda fechado",
        atendimento: "Salão, retirada e delivery",
        entrega: {
            taxa: "R$ 00,00",
            area: "bairros atendidos",
            tempo: "40 a 60 min"
        },
        pagamento: "Pix, cartão de crédito/débito e dinheiro",
        vegetariano: "Temos opção vegetariana: nome do burger",

        cardapio: {
            "🍔 Burgers": [
                { nome: "Burger 1", desc: "descrição curta", preco: "R$ 00,00" },
                { nome: "Burger 2", desc: "descrição curta", preco: "R$ 00,00" }
            ],
            "🍟 Acompanhamentos": [
                { nome: "Batata frita", preco: "R$ 00,00" }
            ],
            "🥤 Bebidas": [
                { nome: "Refrigerante lata", preco: "R$ 00,00" }
            ],
            "🍰 Sobremesas": [
                { nome: "Sobremesa", preco: "R$ 00,00" }
            ],
            "➕ Adicionais": [
                { nome: "Bacon", preco: "R$ 00,00" }
            ]
        },

        promocoes: [
            { nome: "Combo 1", desc: "burger + batata + bebida", preco: "R$ 00,00" }
        ],

        // Botões rápidos: rótulo exibido e mensagem enviada
        opcoesRapidas: [
            { rotulo: "🍔 Cardápio",   mensagem: "Quero ver o cardápio" },
            { rotulo: "🎁 Promoções",  mensagem: "Quais são as promoções?" },
            { rotulo: "🛵 Fazer pedido", mensagem: "Quero fazer um pedido" },
            { rotulo: "🕐 Horários",   mensagem: "Qual o horário de funcionamento?" },
            { rotulo: "📍 Entrega",    mensagem: "Vocês fazem entrega?" }
        ]
    };


    /* =====================================================
       FUNÇÕES AUXILIARES
       ===================================================== */

    let busy = false;   // impede enviar enquanto o bot "digita"

    function getTime() {

        const now = new Date();

        return now.toLocaleTimeString("pt-BR", {
            hour: "2-digit",
            minute: "2-digit"
        });

    }


    // Minúsculas e sem acentos, para comparar palavras-chave
    function normalize(text) {

        return text
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "");

    }


    // Verifica palavra inteira; "entreg*" aceita qualquer final (entrega, entregam...)
    function hasKeyword(message, keyword) {

        const prefix = keyword.endsWith("*");
        const word = keyword.replace("*", "").replace(/\s+/g, "\\s+");
        const regex = new RegExp("\\b" + word + (prefix ? "\\w*" : "\\b"));

        return regex.test(message);

    }


    function whatsappLink(texto) {

        return "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(texto);

    }


    // Gera o HTML dos botões de ação de uma resposta
    function buildActions(actions) {

        if (!actions || actions.length === 0) {
            return "";
        }

        const items = actions.map(a => {

            if (a.url) {
                return `<a class="action" href="${a.url}" target="_blank" rel="noopener">${a.label}</a>`;
            }

            return `<button class="action" type="button" data-message="${a.message}">${a.label}</button>`;

        }).join("");

        return `<div class="actions">${items}</div>`;

    }


    /* =====================================================
       MENSAGENS
       ===================================================== */

    // type "user": texto puro (seguro contra XSS)
    // type "bot": aceita HTML controlado por nós
    function addMessage(text, type) {

        const chat = document.getElementById("chatMessages");

        const message = document.createElement("div");
        message.classList.add("message", type);

        const content = document.createElement("div");
        content.classList.add("message-content");

        if (type === "user") {
            content.textContent = text;
        } else {
            content.innerHTML = text;
        }

        const time = document.createElement("span");
        time.classList.add("time");
        time.textContent = getTime();

        content.appendChild(time);
        message.appendChild(content);
        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

    }


    function sendMessage() {

        const input = document.getElementById("messageInput");

        const text = input.value.trim();

        if (text === "" || busy) {
            return;
        }

        addMessage(text, "user");

        input.value = "";

        simulateResponse(text);

    }


    function quickMessage(text) {

        if (busy) {
            return;
        }

        addMessage(text, "user");

        simulateResponse(text);

    }


    function handleKey(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }


    /* =====================================================
       RESPOSTAS DO ATENDENTE
       Ordem do array = prioridade. A saudação fica por último.
       Use "*" no fim da palavra para aceitar variações.
       ===================================================== */

    const verCardapio = { label: "🍔 Ver cardápio", message: "Quero ver o cardápio" };
    const fazerPedido = { label: "💬 Pedir no WhatsApp", url: whatsappLink("Olá! Gostaria de fazer um pedido.") };

    const INTENTS = [

        {
            nome: "pedido",
            keywords: ["pedido*", "pedir", "comprar", "encomend*", "reserv*"],
            response: () => `
                🛵 <strong>Fazer pedido</strong><br><br>
                Atendimento: ${CONFIG.atendimento}.<br><br>
                O jeito mais rápido é pelo nosso WhatsApp: ${CONFIG.telefone}.
            `,
            actions: [fazerPedido, verCardapio]
        },

        {
            nome: "delivery",
            keywords: ["entreg*", "delivery", "frete", "taxa", "motoboy"],
            response: () => `
                🛵 <strong>Delivery</strong><br><br>
                Taxa de entrega: ${CONFIG.entrega.taxa}<br>
                Região atendida: ${CONFIG.entrega.area}<br>
                Tempo estimado: ${CONFIG.entrega.tempo}
            `,
            actions: [fazerPedido]
        },

        {
            nome: "promocoes",
            keywords: ["promo*", "combo*", "oferta*", "desconto*"],
            response: () => `
                🎁 <strong>Promoções e combos</strong><br><br>
                ${CONFIG.promocoes.map(p =>
                    `<strong>${p.nome}</strong> – ${p.desc}<br>${p.preco}`
                ).join("<br><br>")}
            `,
            actions: [fazerPedido]
        },

        {
            nome: "vegetariano",
            keywords: ["vegetarian*", "vegan*", "vegano*", "sem carne"],
            response: () => `
                🌱 <strong>Opções vegetarianas</strong><br><br>
                ${CONFIG.vegetariano}
            `,
            actions: [verCardapio]
        },

        {
            nome: "cardapio",
            keywords: ["cardapio", "menu", "burger*", "hamburguer*", "lanche*", "bebida*", "sobremesa*", "batata*", "preco*", "valor*", "quanto"],
            response: () => {

                const secoes = Object.entries(CONFIG.cardapio).map(([titulo, itens]) =>
                    `<strong>${titulo}</strong><br>` +
                    itens.map(i =>
                        `• ${i.nome}${i.desc ? " – " + i.desc : ""} <strong>${i.preco}</strong>`
                    ).join("<br>")
                ).join("<br><br>");

                return `🍔 <strong>Nosso cardápio</strong><br><br>${secoes}`;

            },
            actions: [fazerPedido]
        },

        {
            nome: "pagamento",
            keywords: ["pagamento", "pagar", "pix", "cartao", "dinheiro", "credito", "debito"],
            response: () => `
                💳 <strong>Formas de pagamento</strong><br><br>
                ${CONFIG.pagamento}
            `
        },

        {
            nome: "horario",
            keywords: ["horario*", "aberto", "abre", "fecha", "funcionamento", "hora*"],
            response: () => `
                🕐 <strong>Horário de funcionamento</strong><br><br>
                ${CONFIG.horario}
            `
        },

        {
            nome: "localizacao",
            keywords: ["local*", "endereco", "onde", "chegar", "mapa"],
            response: () => `
                📍 <strong>Localização</strong><br><br>
                ${CONFIG.endereco}
            `,
            actions: [{
                label: "🗺️ Abrir no mapa",
                url: "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.endereco)
            }]
        },

        {
            nome: "contato",
            keywords: ["contato", "telefone", "whatsapp", "zap", "ligar", "instagram"],
            response: () => `
                📞 <strong>Contato</strong><br><br>
                Telefone/WhatsApp: ${CONFIG.telefone}
                ${CONFIG.instagram ? `<br>Instagram: <a href="${CONFIG.instagram}" target="_blank" rel="noopener">${CONFIG.instagram}</a>` : ""}
            `,
            actions: [{ label: "💬 Falar no WhatsApp", url: whatsappLink("Olá! Vim pelo atendimento virtual.") }]
        },

        {
            nome: "saudacao",
            keywords: ["oi", "ola", "bom dia", "boa tarde", "boa noite", "e ai", "opa"],
            response: () => `
                Olá! 😊<br><br>
                É um prazer atender você na <strong>${CONFIG.nome}</strong>.<br><br>
                Quer ver o cardápio ou fazer um pedido?
            `,
            actions: [verCardapio, fazerPedido]
        }

    ];


    function findResponse(text) {

        const message = normalize(text);

        const intent = INTENTS.find(i =>
            i.keywords.some(k => hasKeyword(message, k))
        );

        if (intent) {
            return intent.response() + buildActions(intent.actions);
        }

        // Resposta padrão
        return `
            🤖 Não entendi muito bem essa pergunta.<br><br>
            Você pode perguntar sobre
            <strong>cardápio, promoções, pedidos, entrega, horários
            ou localização</strong>.
        ` + buildActions([verCardapio, fazerPedido]);

    }


    function simulateResponse(text) {

        const typing = document.getElementById("typing");
        const chat = document.getElementById("chatMessages");

        busy = true;

        typing.style.display = "block";
        chat.scrollTop = chat.scrollHeight;

        setTimeout(() => {

            typing.style.display = "none";

            addMessage(findResponse(text), "bot");

            busy = false;

        }, 1200);

    }


    /* =====================================================
       INICIALIZAÇÃO
       ===================================================== */

    function init() {

        document.title = "Atendente Virtual - " + CONFIG.nome;
        document.getElementById("headerIcon").textContent = CONFIG.icone;
        document.getElementById("botName").textContent = CONFIG.atendente;
        document.getElementById("statusText").textContent = "Online • " + CONFIG.nome;

        // Botões rápidos
        const options = document.getElementById("quickOptions");

        CONFIG.opcoesRapidas.forEach(o => {

            const button = document.createElement("button");
            button.className = "option";
            button.type = "button";
            button.textContent = o.rotulo;
            button.addEventListener("click", () => quickMessage(o.mensagem));

            options.appendChild(button);

        });

        // Eventos de envio
        document.getElementById("sendButton").addEventListener("click", sendMessage);
        document.getElementById("messageInput").addEventListener("keydown", handleKey);

        // Botões de ação dentro das respostas (delegação de evento)
        document.getElementById("chatMessages").addEventListener("click", event => {

            const button = event.target.closest("button.action");

            if (button) {
                quickMessage(button.dataset.message);
            }

        });

        // Mensagens iniciais
        addMessage(`
            Olá! 👋<br><br>
            Seja bem-vindo(a) à <strong>${CONFIG.nome}</strong>.<br><br>
            Como posso ajudar você?
        `, "bot");

        addMessage(`
            Você pode perguntar sobre:<br><br>
            🍔 Cardápio<br>
            🛵 Pedidos e delivery<br>
            💰 Preços e promoções<br>
            🕐 Horários<br>
            📍 Localização<br>
            📞 Contato
        `, "bot");

    }

    init();

</script>

</body>
</html>
